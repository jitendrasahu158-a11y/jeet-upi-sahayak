name: Build APK
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          z=$(ls *.zip | grep -vi kit | sort | tail -n 1)
          mkdir -p src && unzip -qo "$z" -d src
          d=$(dirname "$(find src -maxdepth 4 -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$d" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          cp debug.keystore "$PROJECT_DIR/debug.keystore"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --console=plain
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk app-debug.apk
          gh release create "build-${{ github.run_number }}" app-debug.apk --title "APK ${{ github.run_number }}" --notes "UPI Sahayak"
